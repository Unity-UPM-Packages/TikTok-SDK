name: Publish
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: 'Unpublish the current version first, then publish again'
        type: boolean
        default: false
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    env:
      PACKAGE_PATH: com.thelegends.tiktok.sdk/Packages/com.thelegends.tiktok.sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://${{ secrets.VERDACCIO_URL }}'

      # Version is bumped by hand in package.json; skip if it is already on Verdaccio
      - name: Check version
        id: check
        working-directory: ${{ env.PACKAGE_PATH }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            if [ "$FORCE" = "true" ]; then
              echo "$NAME@$VERSION already published, unpublishing to republish"
              npm unpublish "$NAME@$VERSION" --force
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "$NAME@$VERSION already published, skipping"
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
          FORCE: ${{ inputs.force }}

      - name: Publish to Verdaccio
        if: steps.check.outputs.exists == 'false'
        working-directory: ${{ env.PACKAGE_PATH }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Create UPM Branch
        if: steps.check.outputs.exists == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=${{ env.PACKAGE_PATH }} -b upm
          git push origin upm --force
